<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebGPU Calligraphy — Paper and brush</title>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">CIS 5650 / PAPER &amp; BRUSH</p>
          <h1>WebGPU Calligraphy</h1>
          <p>Draw with wet ink. Watch it spread, absorb into the paper, and dry.</p>
        </div>
        <div class="controls">
          <button id="zoom-in" type="button">Zoom +</button>
          <button id="zoom-out" type="button">Zoom −</button>
          <button id="reset" type="button">Reset view</button>
          <button id="clear" type="button">Clear paper</button>
        </div>
      </header>
      <div class="settings">
      <section class="sliders" aria-label="Ink and paper parameters">
        <label title="How fast water spreads between neighbouring cells. Higher = wider bleed.">
          <span>Diffusion</span>
          <input type="range" data-param="diffusion" min="0.02" max="0.24" step="0.01" />
          <output></output>
        </label>
        <label title="Effective water loss to drying. Higher = bleeding stops sooner.">
          <span>Drying</span>
          <input type="range" data-param="absorption" min="0.1" max="3" step="0.05" />
          <output></output>
        </label>
        <label title="How quickly floating pigment fixes to the paper. Lower = more feathering.">
          <span>Settling</span>
          <input type="range" data-param="settling" min="0.1" max="5" step="0.1" />
          <output></output>
        </label>
        <label title="Water deposited by the brush. Pigment stays fixed, so more water = thinner, wetter wash.">
          <span>Water load</span>
          <input type="range" data-param="waterLoad" min="1" max="12" step="0.5" />
          <output></output>
        </label>
        <label title="Brush core radius in paper cells.">
          <span>Brush radius</span>
          <input type="range" data-param="radius" min="1" max="20" step="1" />
          <output></output>
        </label>
        <label title="Paper fibre variation. 0 = perfectly uniform, 1 = fibrous, uneven bleeding.">
          <span>Paper roughness</span>
          <input type="range" data-param="roughness" min="0" max="1" step="0.05" />
          <output></output>
        </label>
        <label title="Sheet thickness in millimeters. Changing this starts a fresh sheet. Thinner paper lets ink reach the back sooner.">
          <span>Thickness (mm)<small style="display:block;font-size:10px;opacity:.75">Changes clear paper</small></span>
          <input type="range" data-param="thickness" min="0.05" max="0.8" step="0.01" />
          <output></output>
        </label>
        <button id="reset-sliders" type="button">Reset sliders</button>
      </section>
      <section class="color-picker" aria-label="Ink color">
        <div class="color-plane">
          <div id="color-field" role="slider" tabindex="0" aria-label="Ink saturation and brightness; use arrow keys" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <span id="color-cursor"></span>
          </div>
          <input id="color-hue" type="range" min="0" max="359" value="0" aria-label="Ink hue" />
        </div>
        <div class="color-values">
          <div class="color-heading"><h2>Ink Color</h2><span id="color-preview" role="img"></span></div>
          <label class="hex-label" for="color-hex">HEX <input id="color-hex" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-describedby="color-error" /></label>
          <div class="rgb-values">
            <label>R<input id="color-r" type="number" min="0" max="255" step="1" aria-label="Red" /></label>
            <label>G<input id="color-g" type="number" min="0" max="255" step="1" aria-label="Green" /></label>
            <label>B<input id="color-b" type="number" min="0" max="255" step="1" aria-label="Blue" /></label>
          </div>
          <div class="ink-swatches" aria-label="Quick ink colors">
            <button type="button" data-ink="#16bfe8" style="--ink:#16bfe8" aria-label="Cyan ink"></button>
            <button type="button" data-ink="#ed32a0" style="--ink:#ed32a0" aria-label="Magenta ink"></button>
            <button type="button" data-ink="#ffe52b" style="--ink:#ffe52b" aria-label="Yellow ink"></button>
            <button type="button" data-ink="#e85b36" style="--ink:#e85b36" aria-label="Vermilion ink"></button>
            <button type="button" data-ink="#0e1116" style="--ink:#0e1116" aria-label="Black ink"></button>
          </div>
          <p id="color-error" aria-live="polite"></p>
        </div>
      </section>
      </div>
      <canvas id="canvas" aria-label="Smooth paper. Drag to draw. Shift-drag or right-drag to rotate. Scroll to zoom. Arrow keys rotate; plus and minus zoom; R resets the view." tabindex="0"></canvas>
      <footer>
        <span id="status" role="status">Initializing WebGPU…</span>
        <span>Draw: drag · Rotate: Shift/right-drag or arrows · Zoom: scroll or +/− · R: reset view</span>
      </footer>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
