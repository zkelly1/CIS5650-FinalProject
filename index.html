<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebGPU Calligraphy — Paper and brush</title>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">CIS 5650 / PAPER &amp; BRUSH</p>
          <h1>WebGPU Calligraphy</h1>
          <p>Draw with wet ink. Watch it spread, absorb into the paper, and dry.</p>
        </div>
        <div class="controls">
          <button id="zoom-in" type="button">Zoom +</button>
          <button id="zoom-out" type="button">Zoom −</button>
          <button id="reset" type="button">Reset view</button>
          <button id="clear" type="button">Clear paper</button>
        </div>
      </header>
      <section class="sliders" aria-label="Ink and paper parameters">
        <label title="How fast water spreads between neighbouring cells. Higher = wider bleed.">
          <span>Diffusion</span>
          <input type="range" data-param="diffusion" min="0.02" max="0.24" step="0.01" />
          <output></output>
        </label>
        <label title="How quickly the paper soaks up water. Higher = bleeding stops sooner.">
          <span>Absorption</span>
          <input type="range" data-param="absorption" min="0.1" max="3" step="0.05" />
          <output></output>
        </label>
        <label title="How quickly floating pigment fixes to the paper. Lower = more feathering.">
          <span>Settling</span>
          <input type="range" data-param="settling" min="0.1" max="5" step="0.1" />
          <output></output>
        </label>
        <label title="Water deposited by the brush. Pigment stays fixed, so more water = thinner, wetter wash.">
          <span>Water load</span>
          <input type="range" data-param="waterLoad" min="1" max="12" step="0.5" />
          <output></output>
        </label>
        <label title="Brush core radius in paper cells.">
          <span>Brush radius</span>
          <input type="range" data-param="radius" min="3" max="20" step="1" />
          <output></output>
        </label>
        <label title="Paper fibre variation. 0 = perfectly uniform, 1 = fibrous, uneven bleeding.">
          <span>Paper roughness</span>
          <input type="range" data-param="roughness" min="0" max="1" step="0.05" />
          <output></output>
        </label>
        <button id="reset-sliders" type="button">Reset sliders</button>
      </section>
      <canvas id="canvas" aria-label="Smooth paper. Drag to draw. Shift-drag or right-drag to rotate. Scroll to zoom. Arrow keys rotate; plus and minus zoom; R resets the view." tabindex="0"></canvas>
      <footer>
        <span id="status" role="status">Initializing WebGPU…</span>
        <span>Draw: drag · Rotate: Shift/right-drag or arrows · Zoom: scroll or +/− · R: reset view</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
